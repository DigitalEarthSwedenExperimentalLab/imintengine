<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<title>ImintEngine — Tile Viewer</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#0f1117;color:#e2e8f0;
  font:13px/1.5 'Inter',system-ui,sans-serif}

/* ── top bar ── */
#topbar{display:flex;align-items:center;gap:10px;padding:0 14px;
  background:#161b27;border-bottom:1px solid #252d3d;height:38px;flex-shrink:0}
#topbar h1{font-size:11px;font-weight:700;color:#4a9eff;letter-spacing:.12em;
  text-transform:uppercase;white-space:nowrap}
.sep{color:#2d3748}
#tile-badge{background:#1a2234;border:1px solid #2d3748;border-radius:4px;
  padding:2px 10px;font-size:12px;font-family:monospace;color:#68d391;
  min-width:90px;text-align:center}
#meta-row{flex:1;font-size:11px;color:#718096;overflow:hidden;white-space:nowrap;
  text-overflow:ellipsis;padding-left:4px}
#index-status{font-size:11px;color:#4a5568;white-space:nowrap;margin-left:8px}
#index-count{color:#4299e1;font-weight:600}

/* ── main ── */
#main{display:flex;height:calc(100vh - 38px)}

/* ── map panel ── */
#map-wrap{width:320px;flex-shrink:0;display:flex;flex-direction:column;
  border-right:1px solid #252d3d}
#map{flex:1}
.leaflet-container{background:#0f1117}
.leaflet-tile-pane{filter:brightness(.5) saturate(.45)}
.leaflet-control-zoom a{background:#1a2234 !important;color:#a0aec0 !important;
  border-color:#2d3748 !important}

/* ── view ── */
#view{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}

/* ── panels row ── */
#panels{flex:1;display:flex;gap:2px;background:#080a10;overflow:hidden;position:relative}

.pane{flex:1;display:flex;flex-direction:column;position:relative;overflow:hidden;min-width:0}
.pane-label{position:absolute;top:8px;left:10px;z-index:20;font-size:10px;
  font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:#cbd5e0;text-shadow:0 1px 4px rgba(0,0,0,.9);
  background:rgba(8,10,16,.55);backdrop-filter:blur(4px);
  padding:3px 8px;border-radius:3px;pointer-events:none}

.pane img{width:100%;height:100%;object-fit:contain;display:block;
  image-rendering:pixelated;image-rendering:crisp-edges}

/* overlay captures mouse, sits above img but below labels */
.pane-ov{position:absolute;inset:0;z-index:10;cursor:crosshair}

/* ── crosshair ── */
.xh-v,.xh-h{position:absolute;pointer-events:none;display:none;z-index:25}
.xh-v{width:1px;top:0;bottom:0;background:rgba(255,255,255,.5)}
.xh-h{height:1px;left:0;right:0;background:rgba(255,255,255,.5)}

/* ── HUD (bottom of RGB pane) ── */
#hud{position:absolute;bottom:8px;left:10px;z-index:30;display:flex;gap:6px;
  pointer-events:none}
.hpill{background:rgba(8,10,16,.65);backdrop-filter:blur(6px);border-radius:3px;
  padding:2px 9px;font-size:11px;color:#e2e8f0;white-space:nowrap}
#hud-cls{min-width:140px}
#hud-xy{font-family:monospace;min-width:72px;color:#a0aec0}

/* ── empty state ── */
#empty-state{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:10px;color:#2d3748;
  pointer-events:none;z-index:5}
#empty-state p{font-size:13px;color:#4a5568}

/* ── legend bar ── */
#legend{height:26px;display:flex;align-items:center;gap:0;padding:0 10px;
  background:#161b27;border-top:1px solid #252d3d;flex-shrink:0;
  overflow-x:auto;scrollbar-width:none}
#legend::-webkit-scrollbar{display:none}
.li{display:flex;align-items:center;gap:4px;padding:0 7px;white-space:nowrap;
  font-size:10.5px;color:#718096;cursor:default;flex-shrink:0}
.ls{width:9px;height:9px;border-radius:2px;flex-shrink:0}
</style>
</head>
<body>

<!-- TOP BAR -->
<div id="topbar">
  <h1>ImintEngine</h1>
  <span class="sep">|</span>
  <span id="tile-badge">—</span>
  <span id="meta-row"></span>
  <span id="index-status">Indexing… <span id="index-count">0</span></span>
</div>

<!-- MAIN -->
<div id="main">

  <!-- MAP -->
  <div id="map-wrap">
    <div id="map"></div>
  </div>

  <!-- VIEWER -->
  <div id="view">

    <!-- IMAGE PANELS -->
    <div id="panels">

      <!-- True Colour -->
      <div class="pane" id="pane-rgb">
        <div class="pane-label">True Colour (B04/B03/B02)</div>
        <img id="img-rgb" src="" alt="">
        <div class="pane-ov" id="ov-rgb"></div>
        <div class="xh-v" id="xv-rgb"></div>
        <div class="xh-h" id="xh-rgb"></div>
        <div id="hud">
          <div class="hpill" id="hud-cls"></div>
          <div class="hpill" id="hud-xy"></div>
        </div>
      </div>

      <!-- NMD Ground Truth -->
      <div class="pane" id="pane-nmd">
        <div class="pane-label">NMD Ground Truth</div>
        <img id="img-nmd" src="" alt="">
        <div class="pane-ov" id="ov-nmd"></div>
        <div class="xh-v" id="xv-nmd"></div>
        <div class="xh-h" id="xh-nmd"></div>
      </div>

      <!-- empty -->
      <div id="empty-state">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.3">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <path d="M3 9h18M9 3v18"/>
        </svg>
        <p>Select a tile on the map</p>
      </div>
    </div>

    <!-- LEGEND -->
    <div id="legend"></div>
  </div>
</div>

<script>
// ── config ───────────────────────────────────────────────────────────────────
const SERVER = 'http://localhost:8094';

// ── class schema ─────────────────────────────────────────────────────────────
const CLASSES = [
  [0,  'bakgrund',            [0,0,0]],
  [1,  'tallskog',            [0,100,0]],
  [2,  'granskog',            [34,139,34]],
  [3,  'lövskog',             [50,205,50]],
  [4,  'blandskog',           [60,179,113]],
  [5,  'sumpskog',            [46,79,46]],
  [6,  'tillfälligt ej skog', [160,200,120]],
  [7,  'våtmark',             [139,90,43]],
  [8,  'öppen mark',          [210,180,140]],
  [9,  'bebyggelse',          [255,0,0]],
  [10, 'vatten',              [0,0,255]],
  [11, 'vete',                [230,180,34]],
  [12, 'korn',                [212,130,23]],
  [13, 'havre',               [255,255,100]],
  [14, 'oljeväxter',          [45,180,90]],
  [15, 'slåttervall',         [100,200,100]],
  [16, 'bete',                [80,160,60]],
  [17, 'potatis',             [180,80,40]],
  [18, 'sockerbetor',         [200,100,200]],
  [19, 'trindsäd',            [140,180,50]],
  [20, 'råg',                 [190,150,80]],
  [21, 'övrig åker',          [170,170,170]],
  [22, 'hygge',               [0,206,209]],
];

// ── build legend ─────────────────────────────────────────────────────────────
const legendEl = document.getElementById('legend');
for (const [i, name, [r,g,b]] of CLASSES.slice(1)) {
  const el = document.createElement('div');
  el.className = 'li';
  el.title = `class ${i}`;
  el.innerHTML =
    `<span class="ls" style="background:rgb(${r},${g},${b})"></span>${name}`;
  legendEl.appendChild(el);
}

// ── Leaflet ──────────────────────────────────────────────────────────────────
const leafMap = L.map('map', {zoomControl:true, attributionControl:false})
                 .setView([62.0, 16.5], 5);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {maxZoom:19}).addTo(leafMap);

const markers = {};     // tid → CircleMarker
let selectedTid = null;
let tileIndex   = {};

function markerStyle(selected) {
  return selected
    ? {radius:6, color:'#f56565', fillColor:'#f56565', fillOpacity:.9, weight:1.5}
    : {radius:3, color:'#4299e1', fillColor:'#4299e1', fillOpacity:.65, weight:1};
}

function addMarkersFromIndex(tiles) {
  let added = 0;
  for (const [tid, meta] of Object.entries(tiles)) {
    if (markers[tid] || !meta.lat) continue;
    const m = L.circleMarker([meta.lat, meta.lon], markerStyle(false)).addTo(leafMap);
    m.on('click', () => selectTile(tid));
    m.on('mouseover', () => {
      if (!selectedTid)
        document.getElementById('tile-badge').textContent = tid;
    });
    markers[tid] = m;
    added++;
  }
  return added;
}

// ── index polling ─────────────────────────────────────────────────────────────
function pollIndex() {
  fetch(`${SERVER}/index.json`, {cache:'no-store'})
    .then(r => r.json())
    .then(data => {
      const n = Object.keys(data.tiles).length;
      document.getElementById('index-count').textContent = n.toLocaleString();
      for (const [tid, meta] of Object.entries(data.tiles)) {
        if (!tileIndex[tid]) tileIndex[tid] = meta;
      }
      addMarkersFromIndex(data.tiles);
      if (!data.ready) {
        setTimeout(pollIndex, 3000);
      } else {
        document.getElementById('index-status').innerHTML =
          `<span style="color:#68d391">✓</span>&nbsp;${n.toLocaleString()} tiles`;
      }
    })
    .catch(() => {
      document.getElementById('index-status').textContent = 'Server offline (localhost:8094)';
      setTimeout(pollIndex, 5000);
    });
}

// ── tile selection ─────────────────────────────────────────────────────────────
const imgRgb   = document.getElementById('img-rgb');
const imgNmd   = document.getElementById('img-nmd');
const emptyEl  = document.getElementById('empty-state');

let currentMeta = null;
let nmdCanvas   = null;
let nmdCtx      = null;

function selectTile(tid) {
  if (selectedTid && markers[selectedTid])
    markers[selectedTid].setStyle(markerStyle(false));

  selectedTid = tid;
  document.getElementById('tile-badge').textContent = tid;
  emptyEl.style.display = 'none';

  if (markers[tid]) {
    markers[tid].setStyle(markerStyle(true));
    leafMap.panTo(markers[tid].getLatLng(), {animate:true, duration:.4});
  }

  const ts = Date.now();
  imgRgb.src = `${SERVER}/tile/${tid}/rgb.png?_=${ts}`;
  imgNmd.src = `${SERVER}/tile/${tid}/nmd.png?_=${ts}`;
  nmdCanvas  = null;

  imgNmd.onload = () => {
    nmdCanvas = document.createElement('canvas');
    nmdCanvas.width  = imgNmd.naturalWidth;
    nmdCanvas.height = imgNmd.naturalHeight;
    nmdCtx = nmdCanvas.getContext('2d', {willReadFrequently:true});
    nmdCtx.drawImage(imgNmd, 0, 0);
  };

  fetch(`${SERVER}/tile/${tid}/meta.json`)
    .then(r => r.json())
    .then(meta => {
      currentMeta = meta;
      const top = Object.entries(meta.classes)
        .sort((a,b) => b[1].pct - a[1].pct)
        .slice(0,4)
        .map(([,v]) => `<span style="color:#a0aec0">${v.name}</span>&nbsp;${v.pct}%`)
        .join('  <span style="color:#2d3748">·</span>  ');
      document.getElementById('meta-row').innerHTML = top;
    });
}

// ── class lookup ──────────────────────────────────────────────────────────────
function classFromPixel(r, g, b) {
  let best = -1, bestD = Infinity;
  for (const [i,, [cr,cg,cb]] of CLASSES) {
    const d = (r-cr)**2 + (g-cg)**2 + (b-cb)**2;
    if (d < bestD) { bestD=d; best=i; }
  }
  return bestD < 4000 ? best : -1;
}

// ── synchronized crosshair ────────────────────────────────────────────────────
const PANES = ['rgb','nmd'];

// Returns {offX, offY, imgW, imgH} for a pane — accounts for object-fit:contain
function paneImgRect(paneId) {
  const pane  = document.getElementById(paneId);
  const imgEl = document.getElementById(paneId.replace('pane-','img-'));
  const nw = imgEl.naturalWidth  || 256;
  const nh = imgEl.naturalHeight || 256;
  const {width:pw, height:ph} = pane.getBoundingClientRect();
  const scale = Math.min(pw/nw, ph/nh);
  const iw = nw*scale, ih = nh*scale;
  return {offX:(pw-iw)/2, offY:(ph-ih)/2, imgW:iw, imgH:ih, natW:nw, natH:nh};
}

function setXhair(rx, ry) {
  for (const p of PANES) {
    const {offX, offY, imgW, imgH} = paneImgRect(`pane-${p}`);
    const px = offX + rx*imgW;
    const py = offY + ry*imgH;
    const vEl = document.getElementById(`xv-${p}`);
    const hEl = document.getElementById(`xh-${p}`);
    vEl.style.left    = px+'px';
    vEl.style.display = 'block';
    hEl.style.top     = py+'px';
    hEl.style.display = 'block';
  }
}

function hideXhair() {
  for (const p of PANES) {
    document.getElementById(`xv-${p}`).style.display = 'none';
    document.getElementById(`xh-${p}`).style.display = 'none';
  }
  document.getElementById('hud-cls').textContent = '';
  document.getElementById('hud-xy').textContent  = '';
}

function onPaneMouse(e, paneId) {
  const pane = document.getElementById(paneId);
  const rect = pane.getBoundingClientRect();
  const {offX, offY, imgW, imgH, natW, natH} = paneImgRect(paneId);

  const mx = e.clientX - rect.left - offX;
  const my = e.clientY - rect.top  - offY;

  if (mx < 0 || my < 0 || mx > imgW || my > imgH) return hideXhair();

  const rx = mx / imgW;
  const ry = my / imgH;
  setXhair(rx, ry);

  const px = Math.floor(rx * natW);
  const py = Math.floor(ry * natH);
  document.getElementById('hud-xy').textContent = `${px}, ${py}`;

  // class from NMD canvas (works when hovering either panel)
  if (nmdCanvas) {
    const cx = Math.floor(rx * nmdCanvas.width);
    const cy = Math.floor(ry * nmdCanvas.height);
    const [r,g,b] = nmdCtx.getImageData(cx, cy, 1, 1).data;
    const cls = classFromPixel(r, g, b);
    document.getElementById('hud-cls').textContent =
      cls >= 0 ? `${cls}: ${CLASSES[cls][1]}` : '';
  }
}

for (const p of PANES) {
  const ov = document.getElementById(`ov-${p}`);
  ov.addEventListener('mousemove', e => onPaneMouse(e, `pane-${p}`));
  ov.addEventListener('mouseleave', hideXhair);
}

// ── start ─────────────────────────────────────────────────────────────────────
pollIndex();
</script>
</body>
</html>
