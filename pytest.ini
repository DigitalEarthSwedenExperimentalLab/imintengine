[pytest]
# These tests check the public site (imint-showcase) or the image-publishing
# workflow, neither of which is part of this repository.
addopts =
    --deselect tests/test_lclu_public.py::test_showcase_page_calls_the_public_host
    --deselect tests/test_repo_hygiene.py::test_oci_image_license_labels_are_apache_2_0
    --deselect tests/test_crop_source_freeze_operator.py::test_pr_and_publish_images_smoke_operator_runtime
    --deselect tests/test_crop_distill_supply_chain.py::test_privileged_workflow_actions_are_full_commit_pins
    --deselect tests/test_crop_distill_supply_chain.py::test_pull_request_jobs_cannot_receive_publish_permissions
    --deselect tests/test_crop_distill_supply_chain.py::test_publish_smokes_exact_pushed_digest_before_signing
    --deselect tests/test_crop_distill_supply_chain.py::test_storage_prep_smoke_uses_exact_linux_security_boundary
    --deselect tests/test_crop_distill_supply_chain.py::test_cosign_verification_is_exact_and_cannot_mask_failure
    --deselect tests/test_crop_distill_supply_chain.py::test_crop_digest_evidence_is_published_only_after_verification
    --deselect tests/test_crop_distill_supply_chain.py::test_summary_distinguishes_pr_validation_from_signed_publish
